<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; }
  canvas#c{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ui{ position:fixed; inset:0; pointer-events:none; z-index:2; }

  #heart-label{
    position:absolute; left:50%; top:60%;
    transform:translate(-50%,-50%);
    font-family:'Cormorant Garamond',serif;
    font-style:italic; font-weight:600;
    font-size:clamp(1.8rem,5.5vw,2.8rem);
    color:#fff8d6;
    text-shadow:0 0 30px rgba(255,210,80,1),0 0 12px rgba(255,180,40,.9),0 0 60px rgba(255,200,60,.5),0 2px 5px rgba(0,0,0,.95);
    white-space:nowrap; letter-spacing:.08em;
    opacity:1;
  }

  .flower{
    position:absolute; display:flex; flex-direction:column; align-items:center; gap:5px;
    pointer-events:auto; cursor:pointer;
    opacity:0; transform:scale(0.7);
    transition:opacity .9s ease,transform .9s ease;
  }
  .flower.show{ opacity:1; transform:scale(1); }
  .flower svg{ filter:drop-shadow(0 0 10px rgba(224,179,64,.55)); }
  .flower span{
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(.78rem,2.4vw,.92rem); color:#FEFFC7;
    text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.8);
    text-align:center; max-width:9em;
  }

  #intro{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:radial-gradient(ellipse at 50% 40%,#0a0520,#000 75%);
    transition:opacity .7s ease,visibility .7s;
  }
  #intro.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .card{
    width:min(340px,100%);
    background:linear-gradient(160deg,#f3dfa4,#d9a441 60%,#c68a2e);
    border-radius:14px; padding:2rem 1.7rem 1.8rem;
    text-align:center; color:#5c3a0d;
    box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 70px rgba(224,179,64,.25);
  }
  .card h2{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.8rem; margin:0 0 .7rem; }
  .card p{ font-size:.9rem; line-height:1.55; margin:0 0 1rem; }
  .card .sig{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.45rem; margin:0 0 1.3rem; }
  .card button{
    border:0; background:#5c3a0d; color:#ffe9a8;
    font-size:.9rem; font-weight:600;
    padding:.7rem 1.7rem; border-radius:999px; cursor:pointer;
  }

  #modal{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:rgba(6,4,0,.85); backdrop-filter:blur(6px);
    opacity:0; pointer-events:none; transition:opacity .35s;
  }
  #modal.open{ opacity:1; pointer-events:auto; }
  .mbox{
    width:min(420px,100%);
    background:linear-gradient(180deg,#1c1808,#14110a);
    border:1px solid rgba(224,179,64,.22); border-radius:18px;
    padding:1.8rem 1.6rem 1.9rem; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(224,179,64,.1);
    transform:translateY(16px) scale(.97); opacity:0;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s;
  }
  #modal.open .mbox{ transform:translateY(0) scale(1); opacity:1; }
  .mclose{
    position:absolute; top:.8rem; right:.8rem; width:32px; height:32px;
    border-radius:50%; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04); color:#FEFFC7; font-size:.95rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .mphoto{
    width:100%; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
    margin-bottom:1.1rem; background:linear-gradient(150deg,#1c1808,#2c2413);
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.05);
  }
  .mphoto img{ width:100%; height:100%; object-fit:cover; display:block; }
  .mphoto .ph{ color:#cdbf98; font-size:.8rem; text-align:center; padding:1rem; line-height:1.5; }
  .mphoto .ph span{ display:block; font-size:1.5rem; margin-bottom:.4rem; }
  .mtext{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.22rem; line-height:1.5; color:#FEFFC7; margin:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="heart-label">Te amo ♥</div>
</div>

<div id="intro">
  <div class="card">
    <p style="font-size:2.4rem;margin-bottom:.5rem">🌻</p>
    <h2>Mi amor:</h2>
    <p>Estas flores amarillas son como tú: brillantes, radiantes y llenas de alegría. Gracias por iluminar cada uno de mis días.</p>
    <p class="sig">Te Amo Mucho</p>
    <button id="openBtn">Abrir 🌻</button>
  </div>
</div>

<div id="modal">
  <div class="mbox">
    <button class="mclose" id="mclose">✕</button>
    <div class="mphoto" id="mphoto"></div>
    <p class="mtext" id="mtext"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ══ PERSONALIZA AQUÍ ══ */
const FLOWERS = [
  { label:"El primer día",   photo:"photos/1.jpg", text:"Desde el primer día supe que contigo todo iba a ser distinto. Esta flor es por ese momento en el que empezó todo." },
  { label:"Lo que me enamora de ti",   photo:"photos/2.jpg", text:"tu preciosa sonrisa ,que es la cura de todos mis dias malos mi amor." },
  { label:"Nuestros 2 años", photo:"photos/3.jpg", text:"Dos años juntos y siguen sabiendo a poco. Gracias por caminar a mi lado en cada paso, cada plan y cada locura." },
  { label:"Lo que admiro",   photo:"photos/4.jpg", text:"Te dedico esta flor por todos los dias que estudias y lo pasas mal ,  admiro demasiado como te esfuerzas amor mio." },
  { label:"Nuestro futuro",  photo:"photos/5.jpg", text:"Esta flor es por todo lo que aún nos queda por vivir. Y en un futuro no muy lejano ,en vez de peluches sean nuestros hijos ." },
  { label:"Gracias",         photo:"photos/6.jpg", text:"Simplemente gracias por existir y por dejarme formar parte de tu vida. Te quiero, hoy y todos los días." }
];

/* ══ RENDERER ══ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x000005,1);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000005, 0.0012);

/* cámara cenital — viendo la galaxia desde arriba */
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 110, 55);
camera.lookAt(0,0,0);

window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

/* ── helpers de color ── */
const col = (hex) => new THREE.Color(hex);

/* ══════════════════════════════════════════
   1. ESTRELLAS DE FONDO con colores reales
══════════════════════════════════════════ */
(()=>{
  const N=7000, pos=new Float32Array(N*3), c=new Float32Array(N*3);
  const palette=[0xffffff,0xaaccff,0xffd0a0,0xff9966,0xffeeaa,0xccddff,0xff6666];
  for(let i=0;i<N;i++){
    const r=300+Math.random()*900;
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const cl=col(palette[Math.floor(Math.random()*palette.length)]);
    c[i*3]=cl.r; c[i*3+1]=cl.g; c[i*3+2]=cl.b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.55,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.8,depthWrite:false})));
})();

/* ══════════════════════════════════════════
   2. GALAXIA ESPIRAL vista desde arriba
   4 brazos, colores dorado+naranja+azul
══════════════════════════════════════════ */
const galaxyGroup = new THREE.Group();
scene.add(galaxyGroup);

(()=>{
  const N=28000;
  const pos=new Float32Array(N*3), c=new Float32Array(N*3);
  const ARMS=4, SPIN=0.7, SPREAD=0.38;

  for(let i=0;i<N;i++){
    const halo = Math.random()<0.10;
    let px,py,pz,cl;
    if(halo){
      const r=50+Math.pow(Math.random(),1.3)*100;
      const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
      px=r*Math.sin(ph)*Math.cos(th);
      py=r*Math.cos(ph)*0.22;
      pz=r*Math.sin(ph)*Math.sin(th);
      cl=col(0x2a1800).lerp(col(0x804010),Math.random()*0.4);
    } else {
      const r=Math.pow(Math.random(),1.4)*85+0.5;
      const arm=Math.floor(Math.random()*ARMS)*(Math.PI*2/ARMS);
      const twist=r*SPIN;
      const noise=(Math.random()-0.5)*SPREAD*(1+r*0.015);
      const angle=arm+twist+noise;
      px=Math.cos(angle)*r;
      py=(Math.random()-0.5)*Math.exp(-r*0.022)*2.8;
      pz=Math.sin(angle)*r;

      const t=r/85;
      if(t<0.08){
        cl=col(0xFFFFFF).lerp(col(0xFFEE88),t*8);
      } else if(t<0.3){
        cl=col(0xFFCC44).lerp(col(0xFF8800),(t-0.08)/0.22);
        if(Math.random()<0.06) cl=col(0x88aaff);
        if(Math.random()<0.04) cl=col(0xff6644);
      } else if(t<0.65){
        cl=col(0xFF8800).lerp(col(0xCC4400),(t-0.3)/0.35);
        if(Math.random()<0.07) cl=col(0x4488ff).lerp(col(0xffffff),0.5);
        if(Math.random()<0.05) cl=col(0xff3300);
      } else {
        cl=col(0x882200).lerp(col(0x221100),(t-0.65)/0.35);
        if(Math.random()<0.06) cl=col(0x3366ff).lerp(col(0xaaccff),0.4);
      }
    }
    pos[i*3]=px; pos[i*3+1]=py; pos[i*3+2]=pz;
    const b=0.6+Math.random()*0.4;
    c[i*3]=cl.r*b; c[i*3+1]=cl.g*b; c[i*3+2]=cl.b*b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  const mat=new THREE.PointsMaterial({size:.42,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.92,depthWrite:false});
  mat.blending=THREE.AdditiveBlending;
  galaxyGroup.add(new THREE.Points(geo,mat));
})();

/* ══ NÚCLEO — esfera luminosa densa ══ */
(()=>{
  const N=5000, pos=new Float32Array(N*3), c=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=Math.pow(Math.random(),2.8)*12;
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph)*0.5;
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const t=r/12;
    const cl=col(0xFFFFFF).lerp(col(0xFFCC44),t).lerp(col(0xFF8800),t*t);
    const b=0.8+Math.random()*0.2;
    c[i*3]=cl.r*b; c[i*3+1]=cl.g*b; c[i*3+2]=cl.b*b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  const mat=new THREE.PointsMaterial({size:.85,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.99,depthWrite:false});
  mat.blending=THREE.AdditiveBlending;
  galaxyGroup.add(new THREE.Points(geo,mat));
})();

/* ══ NEBULOSA — manchas gaseosas de color ══ */
(()=>{
  const clouds=[
    {cx:32,cy:0,cz:18,r:28,c1:0xFF8800,c2:0xFF4400,op:0.18},
    {cx:-40,cy:0,cz:-12,r:24,c1:0xFF6600,c2:0xCC2200,op:0.15},
    {cx:18,cy:0,cz:-38,r:22,c1:0x2244cc,c2:0x8844ff,op:0.16},
    {cx:-22,cy:0,cz:42,r:20,c1:0x1133bb,c2:0x4422aa,op:0.14},
    {cx:60,cy:0,cz:-28,r:18,c1:0xaa4400,c2:0x662200,op:0.13},
    {cx:-55,cy:0,cz:30,r:16,c1:0x334499,c2:0x112266,op:0.12},
  ];
  clouds.forEach(cl=>{
    const N=800, pos=new Float32Array(N*3), c=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      const r=Math.pow(Math.random(),.7)*cl.r;
      const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
      pos[i*3]=cl.cx+r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1]=cl.cy+r*Math.cos(ph)*0.18;
      pos[i*3+2]=cl.cz+r*Math.sin(ph)*Math.sin(th);
      const t=Math.random();
      const clr=col(cl.c1).lerp(col(cl.c2),t);
      const b=0.25+Math.random()*0.45;
      c[i*3]=clr.r*b; c[i*3+1]=clr.g*b; c[i*3+2]=clr.b*b;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',new THREE.BufferAttribute(c,3));
    const mat=new THREE.PointsMaterial({size:2.2,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:cl.op,depthWrite:false});
    mat.blending=THREE.AdditiveBlending;
    galaxyGroup.add(new THREE.Points(geo,mat));
  });
})();

/* ══════════════════════════════════════════
   3. PLANETAS 3D orbitando con materiales
══════════════════════════════════════════ */
const planetData = [
  { r:4.2, dist:28, speed:0.0018, tilt:.3,  col:0x4488bb, ring:false, emissive:0x112233 },
  { r:3.0, dist:38, speed:0.0013, tilt:.5,  col:0xcc4422, ring:false, emissive:0x330a06 },
  { r:5.5, dist:52, speed:0.0009, tilt:.2,  col:0x44aa88, ring:true,  emissive:0x0a2218 },
  { r:2.5, dist:18, speed:0.0025, tilt:.7,  col:0xaa6633, ring:false, emissive:0x281808 },
  { r:6.0, dist:68, speed:0.0007, tilt:.15, col:0x8855cc, ring:false, emissive:0x180a30 },
  { r:3.5, dist:80, speed:0.0005, tilt:.4,  col:0xcc6633, ring:false, emissive:0x301508 },
  { r:2.2, dist:92, speed:0.0004, tilt:.6,  col:0x336699, ring:false, emissive:0x081520 },
  { r:4.8, dist:44, speed:0.0011, tilt:.25, col:0xdd8833, ring:true,  emissive:0x302000 },
];

const planets = [];
const planetAngles = planetData.map(()=>Math.random()*Math.PI*2);

planetData.forEach((pd,i)=>{
  const geo = new THREE.SphereGeometry(pd.r, 32, 32);
  const mat = new THREE.MeshPhongMaterial({
    color: pd.col,
    emissive: pd.emissive,
    shininess: 35,
    specular: 0x334455,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = pd.tilt;
  mesh.castShadow = true;

  const pivot = new THREE.Object3D();
  pivot.rotation.y = planetAngles[i];
  pivot.add(mesh);
  mesh.position.set(pd.dist, 0, 0);

  /* anillo estilo Saturno */
  if(pd.ring){
    const rGeo = new THREE.RingGeometry(pd.r*1.35, pd.r*2.1, 64);
    const rMat = new THREE.MeshBasicMaterial({
      color:0xccaa66, side:THREE.DoubleSide,
      transparent:true, opacity:0.55, depthWrite:false
    });
    const ring = new THREE.Mesh(rGeo, rMat);
    ring.rotation.x = Math.PI/2.5;
    mesh.add(ring);
  }

  /* pequeña atmósfera brillante */
  const atmGeo = new THREE.SphereGeometry(pd.r*1.12, 20, 20);
  const atmMat = new THREE.MeshPhongMaterial({
    color: pd.col,
    transparent:true, opacity:0.08,
    side:THREE.FrontSide, depthWrite:false
  });
  mesh.add(new THREE.Mesh(atmGeo, atmMat));

  galaxyGroup.add(pivot);
  planets.push({ pivot, mesh, speed:pd.speed, dist:pd.dist });
});

/* luz puntual desde el núcleo para iluminar planetas */
const coreLight = new THREE.PointLight(0xFFAA44, 2.2, 180, 1.5);
coreLight.position.set(0,0,0);
scene.add(coreLight);
const ambLight = new THREE.AmbientLight(0x111122, 0.8);
scene.add(ambLight);

/* ══════════════════════════════════════════
   4. CORAZÓN — 3 200 partículas, grande,
   centrado, visible desde el inicio
══════════════════════════════════════════ */
const heartGroup = new THREE.Group();
heartGroup.position.set(0,38,12);
scene.add(heartGroup);

const heartOrigPos=[];
(()=>{
  const N=3200, S=14;
  const pos=new Float32Array(N*3), c=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const tA=(i/N)*Math.PI*2+(Math.random()-.5)*.18;
    const onEdge=Math.random()<.62;
    const depth=onEdge?(.9+Math.random()*.1):(.15+Math.random()*.82);
    let x=16*Math.pow(Math.sin(tA),3)*depth;
    let y=(13*Math.cos(tA)-5*Math.cos(2*tA)-2*Math.cos(3*tA)-Math.cos(4*tA))*depth;
    const j=onEdge?1.4:3.8;
    x+=(Math.random()-.5)*j; y+=(Math.random()-.5)*j;
    const z=(Math.random()-.5)*(onEdge?1.8:4);
    const px=x*S/17, py=y*S/17, pz=z;
    pos[i*3]=px; pos[i*3+1]=py; pos[i*3+2]=pz;
    heartOrigPos.push(px,py,pz);
    const b=onEdge?(.82+Math.random()*.18):(.5+Math.random()*.38);
    const cl=onEdge
      ?col(0xFFFFFF).lerp(col(0xE0B340),.25+Math.random()*.5)
      :col(0xE0B340).lerp(col(0xB07820),Math.random()*.6);
    c[i*3]=cl.r*b; c[i*3+1]=cl.g*b; c[i*3+2]=cl.b*b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  const mat=new THREE.PointsMaterial({size:.28,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.97,depthWrite:false});
  mat.blending=THREE.AdditiveBlending;
  heartGroup.add(new THREE.Points(geo,mat));
  scene.userData.heartPts=heartGroup.children[0];
})();

/* ══ POLVO VOLANDO HACIA CÁMARA ══ */
const dustPos=new Float32Array(2500*3);
const dustSpd=new Float32Array(2500);
(()=>{
  for(let i=0;i<2500;i++){
    dustPos[i*3]=(Math.random()-.5)*250;
    dustPos[i*3+1]=(Math.random()-.5)*130;
    dustPos[i*3+2]=(Math.random()-.5)*250;
    dustSpd[i]=0.05+Math.random()*.14;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
  const mat=new THREE.PointsMaterial({size:.3,color:0xFFE090,sizeAttenuation:true,transparent:true,opacity:.45,depthWrite:false});
  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  scene.userData.dust={pts,geo};
})();

/* ══ ANIMACIÓN ══ */
let T=0;
function animate(){
  requestAnimationFrame(animate);
  T+=0.004;

  /* galaxia rota lentamente (vista cenital) */
  galaxyGroup.rotation.y=T*0.10;

  /* planetas orbitan a distintas velocidades */
  planets.forEach((p,i)=>{
    p.pivot.rotation.y+=planetData[i].speed;
    p.mesh.rotation.y+=0.008;
  });

  /* corazón pulsa + cada partícula vibra */
  const pulse=1+Math.sin(T*1.5)*.045;
  heartGroup.scale.setScalar(pulse);
  heartGroup.rotation.y=Math.sin(T*.25)*.15;
  const hp=scene.userData.heartPts;
  if(hp){
    const pa=hp.geometry.attributes.position.array;
    for(let i=0;i<pa.length/3;i++){
      const ox=heartOrigPos[i*3],oy=heartOrigPos[i*3+1],oz=heartOrigPos[i*3+2];
      const ph=T*2.6+i*.41, j=.07;
      pa[i*3]=ox+Math.sin(ph)*j;
      pa[i*3+1]=oy+Math.cos(ph*1.3)*j;
      pa[i*3+2]=oz+Math.sin(ph*.7+1)*j;
    }
    hp.geometry.attributes.position.needsUpdate=true;
  }

  /* polvo */
  for(let i=0;i<dustSpd.length;i++){
    dustPos[i*3+2]+=dustSpd[i];
    if(dustPos[i*3+2]>120){ dustPos[i*3]=(Math.random()-.5)*250; dustPos[i*3+1]=(Math.random()-.5)*130; dustPos[i*3+2]=-120; }
  }
  scene.userData.dust.geo.attributes.position.needsUpdate=true;

  /* luz del núcleo parpadea levemente */
  coreLight.intensity=2.2+Math.sin(T*1.8)*.3;

  /* cámara: órbita suave cenital, ligeramente inclinada */
  camera.position.x=Math.sin(T*.03)*18;
  camera.position.y=110+Math.sin(T*.05)*8;
  camera.position.z=55+Math.sin(T*.04)*10;
  camera.lookAt(0,5,0);

  renderer.render(scene,camera);
}
animate();

/* ══ RAMOS CSS flotando ══ */
const SLOTS=[{x:6,y:8},{x:80,y:6},{x:4,y:34},{x:86,y:32},{x:8,y:60},{x:82,y:58},{x:20,y:80},{x:68,y:82}];
const occupied=new Array(SLOTS.length).fill(false);
let cycle=0;
function makeBouquet(sz=54){
  const bloom=(cx,cy,s,rot)=>{
    const petals=[0,60,120,180,240,300].map(a=>`<ellipse fill="#E0B340" stroke="#3a2408" stroke-width="2" cx="${cx}" cy="${cy-s*.38}" rx="${s*.32}" ry="${s*.5}" transform="rotate(${a} ${cx} ${cy})"/>`).join('');
    return `<g transform="rotate(${rot} ${cx} ${cy})">${petals}<circle fill="#826D1C" stroke="#3a2408" stroke-width="2" cx="${cx}" cy="${cy}" r="${s*.33}"/><circle fill="#ffe9a8" opacity="0.6" cx="${cx-s*.1}" cy="${cy-s*.1}" r="${s*.13}"/></g>`;
  };
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg">
    <path fill="#6a7f2e" d="M70,128 C55,110 58,90 70,78 C82,90 85,110 70,128 Z"/>
    <path fill="#4d5e1f" d="M70,128 C60,112 45,102 30,100 C42,116 55,126 70,128 Z"/>
    <path fill="#4d5e1f" d="M70,128 C80,112 95,102 110,100 C98,116 85,126 70,128 Z"/>
    ${bloom(26,50,40,-14)}${bloom(114,50,40,14)}${bloom(70,22,48,0)}</svg>`;
}
function spawnFlower(){
  const empty=SLOTS.map((_,i)=>i).filter(i=>!occupied[i]);
  if(!empty.length) return;
  const si=empty[Math.floor(Math.random()*empty.length)];
  occupied[si]=true;
  const f=FLOWERS[cycle%FLOWERS.length]; cycle++;
  const sz=Math.max(46,Math.min(78,window.innerWidth*.1));
  const el=document.createElement('div');
  el.className='flower';
  el.style.left=SLOTS[si].x+'%';
  el.style.top=SLOTS[si].y+'%';
  el.innerHTML=makeBouquet(sz)+`<span>${f.label}</span>`;
  el.addEventListener('click',()=>openModal(f));
  document.getElementById('ui').appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  const life=4200+Math.random()*2000;
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>{ el.remove(); occupied[si]=false; },950); },life);
}
document.getElementById('openBtn').addEventListener('click',()=>{
  document.getElementById('intro').classList.add('hidden');
  setTimeout(()=>spawnFlower(),800);
  setTimeout(()=>spawnFlower(),1800);
  setTimeout(()=>spawnFlower(),3000);
  setInterval(spawnFlower,2000);
});

/* ══ MODAL ══ */
function openModal(f){
  const ph=document.getElementById('mphoto');
  ph.innerHTML='';
  const img=new Image();
  img.onload=()=>{ ph.innerHTML=''; ph.appendChild(img); };
  img.onerror=()=>{ ph.innerHTML=`<div class="ph"><span>🌼</span>Pon tu foto:<br>${f.photo}</div>`; };
  img.src=f.photo;
  document.getElementById('mtext').textContent=f.text;
  document.getElementById('modal').classList.add('open');
}
document.getElementById('mclose').addEventListener('click',()=>document.getElementById('modal').classList.remove('open'));
document.getElementById('modal').addEventListener('click',e=>{ if(e.target===document.getElementById('modal')) document.getElementById('modal').classList.remove('open'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('modal').classList.remove('open'); });
</script>
